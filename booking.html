<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Book Garden Service | BloomNest
</title>


<meta name="description"
content="Book BloomNest gardening consultation, plants, flower pots and garden setup services.">


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<script src="https://unpkg.com/lucide@latest"></script>


<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="./css/com.css">

<link rel="stylesheet"
href="./css/booking.css">


</head>


<body>


<div id="navbar"></div>


<section class="bulk-booking" id="bulkBooking">

<div class="container">

<div class="section-header">

<span class="section-tag">
<i data-lucide="package-check"></i>
Bulk Order Booking
</span>

<h2>
Request a Bulk Order Quote
</h2>

<p>
Looking for wholesale flower pots, plants, gardening tools,
soil, seeds or fertilizers? Fill out the form below and our
team will contact you with the best pricing.
</p>

</div>

<form class="bulk-booking-form">

<div class="form-grid">

<div class="form-group">
<label for="name">
Full Name
</label>
<input
type="text"
id="name"
placeholder="Enter your full name"
required>
</div>

<div class="form-group">
<label for="company">
Company / Business
</label>
<input
type="text"
id="company"
placeholder="Company name">
</div>

<div class="form-group">
<label for="email">
Email Address
</label>
<input
type="email"
id="email"
placeholder="you@example.com"
required>
</div>

<div class="form-group">
<label for="phone">
Phone Number
</label>
<input
type="tel"
id="phone"
placeholder="+91 98765 43210"
required>
</div>

<div class="form-group">
<label for="category">
Product Category
</label>

<select id="category">

<option>
Select Category
</option>

<option>
Flower Pots
</option>

<option>
Indoor Plants
</option>

<option>
Outdoor Plants
</option>

<option>
Garden Tools
</option>

<option>
Soil & Fertilizers
</option>

<option>
Seeds
</option>

<option>
Mixed Products
</option>

</select>

</div>

<div class="form-group">
<label for="quantity">
Required Quantity
</label>

<input
type="number"
id="quantity"
placeholder="Example: 250">

</div>

<div class="form-group">
<label for="project">
Project Type
</label>

<select id="project">

<option>
Select Project
</option>

<option>
Landscaping
</option>

<option>
Nursery
</option>

<option>
Apartment
</option>

<option>
Hotel / Resort
</option>

<option>
School / College
</option>

<option>
Office
</option>

<option>
Retail Store
</option>

<option>
Other
</option>

</select>

</div>

<div class="form-group">
<label for="date">
Preferred Delivery Date
</label>

<input
type="date"
id="date">

</div>

<div class="form-group full-width">

<label for="address">
Delivery Address
</label>

<textarea
id="address"
rows="3"
placeholder="Enter delivery location">
</textarea>

</div>

<div class="form-group full-width">

<label for="message">
Additional Requirements
</label>

<textarea
id="message"
rows="5"
placeholder="Tell us about your bulk order requirements...">
</textarea>

</div>

</div>

<div class="form-actions">

<button
type="submit"
class="btn btn-primary">

<i data-lucide="send"></i>

Request Quote

</button>

<button
type="reset"
class="btn btn-outline">

Reset Form

</button>

</div>

</form>

</div>

</section>




<div id="footer"></div>




<script src="../js/global.js"></script>

<script src="js/booking.js"></script>


<script>

document.addEventListener(
"DOMContentLoaded",
()=>{

lucide.createIcons();

});

</script>


</body>

</html>
