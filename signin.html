<!DOCTYPE html>
<html lang="en" class="light-mode" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>
Sign In | BloomNest
</title>
<meta name="description"
content="Sign in to your BloomNest account and manage your plants, orders and gardening preferences.">
<link rel="icon" href="./images/favicon.png">
<link rel="preconnect"
href="https://fonts.googleapis.com">
<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet"
href="../global/global.css">
<link rel="stylesheet"
href="css/auth.css">
</head>
<body>
<div class="auth-card">

<div class="card-controls">
<button class="icon-btn"
id="theme-btn"
aria-label="Toggle Dark Mode">
<i data-lucide="moon"></i>
</button>
<button class="icon-btn"
id="rtl-btn"
aria-label="Toggle RTL">
<i data-lucide="arrow-left-right"></i>
</button>
</div>

<div class="card-brand">
<a href="../index.html"
class="logo">
<span class="logo-icon">
<i data-lucide="flower-2"></i>
</span>
<span class="logo-text">
Bloom<span>Nest</span>
</span>
</a>
</div>

<div class="auth-msg"
id="auth-msg">
</div>

<div class="step on">
<h1 class="auth-heading">
Welcome
<em>
Back
</em>
</h1>
<p class="auth-sub">
Sign in to continue your gardening journey.
</p>
<div class="fg">
<label for="email">
Email Address
</label>
<div class="input-wrap">
<input type="email"
id="email"
placeholder="your@email.com">
</div>
</div>
<div class="fg">
<label for="password">
Password
</label>
<div class="input-wrap">
<input type="password"
id="password"
placeholder="Enter your password">
<button type="button"
class="pw-eye"
onclick="togglePw('password',this)">
<i data-lucide="eye"></i>
</button>
</div>
</div>
<div class="login-options">
<label class="auth-check">
<input type="checkbox">
<span>
Remember me
</span>
</label>
<a href="#">
Forgot Password?
</a>
</div>
<button class="auth-btn"
onclick="handleLogin()">
Sign In
<i data-lucide="arrow-right"></i>
</button>

<div class="auth-divider">
<span>
or continue with
</span>
</div>
</button>
<div class="social-btns">
    <button class="social-btn">
        <svg class="social-icon google-icon"
        viewBox="0 0 24 24">
            <path d="M21.35 12.27c0-.72-.06-1.41-.18-2.07H12v3.92h5.23a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.24z"/>
            <path d="M12 22c2.63 0 4.84-.87 6.45-2.49l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.53A9.74 9.74 0 0 0 12 22z"/>
            <path d="M6.54 13.95a5.86 5.86 0 0 1 0-3.9V7.52H3.29a9.99 9.99 0 0 0 0 8.96l3.25-2.53z"/>
            <path d="M12 5.97c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.02 14.63 2 12 2a9.74 9.74 0 0 0-8.71 5.52l3.25 2.53C7.31 7.69 9.46 5.97 12 5.97z"/>
        </svg>
        Google
    </button>
    <button class="social-btn">
        <svg class="social-icon"
        viewBox="0 0 24 24">
        <path d="M13.5 22v-8h2.7l.4-3h-3.1V9.1c0-.9.3-1.5 1.6-1.5h1.7V5c-.3 0-1.4-.1-2.6-.1-2.6 0-4.3 1.6-4.3 4.4V11H7v3h2.9v8h3.6z"/>
        </svg>
        Facebook
    </button>
    <button class="social-btn">
        <svg class="social-icon"
        viewBox="0 0 24 24">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.41 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.51-1.31 3-2.54 4.08zM12.03 7.2C11.88 4.96 13.7 3.1 15.8 3c.29 2.6-2.35 4.55-3.77 4.2z"/>
        </svg>
        Apple
    </button>
</div>
</div>
<div class="card-switch">
<p>
Don't have an account?
</p>
<a href="signup.html">
Create Account
<i data-lucide="arrow-right"></i>
</a>
</div>
</div>
</div>

<script src="../global/global.js"></script>
<script src="js/auth.js"></script>
<script>
lucide.createIcons();
function togglePw(id,btn){
const input =
document.getElementById(id);
const icon =
btn.querySelector("i");
if(input.type === "password"){
input.type="text";
icon.setAttribute(
"data-lucide",
"eye-off"
);
}
else{
input.type="password";
icon.setAttribute(
"data-lucide",
"eye"
);
}
lucide.createIcons();
}
function handleLogin(){
const email =
document.getElementById("email");
const password =
document.getElementById("password");
const msg =
document.getElementById("auth-msg");
if(!email.value || !password.value){
msg.textContent =
"Please enter email and password.";
msg.className =
"auth-msg error";
return;
}
msg.textContent="";
msg.className =
"auth-msg";
window.location.href="../dashboard.html";
}
</script>
</body>
</html>
